{% extends "master.html" %}

{% load static %}

{% block content %}



<h3> {{ object }} </h3>



 <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" rel="stylesheet"/>


<form method="post">{% csrf_token %}

    
<p>El elemento se Dara de baja Definitivamente Se procede a Eliminar "{{ object }}"?</p>


    <input type="submit" value="Confirm">
</form>
 



   
  

<a class="btn btn-secondary" href="/cajas" role="button">ANTERIOR</a>

 {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

{% endblock  %}
